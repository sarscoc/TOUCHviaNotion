<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Uploader</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4f4f1;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:min(680px,100%);background:#fff;border:1px solid #deded8;border-radius:22px;padding:28px;box-shadow:0 18px 55px rgba(0,0,0,.08)}
h1{margin:0 0 8px;font-size:28px}
.sub{margin:0 0 24px;color:#777;font-size:14px;line-height:1.6}
.grid{display:grid;gap:18px}
label{display:grid;gap:8px;font-size:14px;font-weight:700}
select,input[type="password"],input[type="text"]{width:100%;height:48px;border:1px solid #d8d8d2;border-radius:12px;background:#fff;padding:0 14px;font-size:16px;color:#171717;outline:none}
select:focus,input:focus{border-color:#111}
.drop{position:relative;border:2px dashed #cfcfc8;border-radius:16px;min-height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafaf8;cursor:pointer;transition:.15s}
.drop:hover{border-color:#999;background:#f7f7f4}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .hint{text-align:center;color:#777;pointer-events:none;line-height:1.6;padding:20px}
.drop img{display:none;width:100%;max-height:360px;object-fit:contain;background:#eee}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{border:0;border-radius:999px;height:48px;padding:0 22px;font-size:15px;font-weight:700;cursor:pointer}
#upload{background:#111;color:#fff;min-width:180px}
#upload:disabled{opacity:.35;cursor:not-allowed}
#clear{background:#ecece7;color:#222}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:#555;font-weight:500}
.status{min-height:24px;margin-top:2px;font-size:14px;line-height:1.6}
.status.ok{color:#176b2c}.status.err{color:#b11f24}.status.work{color:#555}
.note{margin-top:18px;padding-top:18px;border-top:1px solid #ecece7;color:#888;font-size:12px;line-height:1.7}
.file-name{font-size:13px;color:#555;font-weight:500;word-break:break-all}
@media(max-width:560px){body{padding:12px}.wrap{padding:20px;border-radius:18px}.actions{align-items:stretch}.actions button{width:100%}}
</style>
</head>
<body>
<main class="wrap">
  <h1>Background Uploader</h1>
  <p class="sub">背景の枠を選んで画像を入れるだけ。画像はJPEGに変換して、選んだ枠のファイルを上書きします。</p>

  <div class="grid">
    <label>
      背景
      <select id="slot">
        <option value="nomal">通常（nomal.jpg）</option>
        <option value="spring">春（spring.jpg）</option>
        <option value="summer">夏（summer.jpg）</option>
        <option value="autumn">秋（autumn.jpg）</option>
        <option value="winter">冬（winter.jpg）</option>
      </select>
    </label>

    <label>
      GitHub Token
      <input id="token" type="password" autocomplete="off" placeholder="github_pat_...">
      <span class="remember"><input id="remember" type="checkbox" checked> このブラウザに保存する</span>
    </label>

    <label>
      画像
      <div class="drop" id="drop">
        <input id="file" type="file" accept="image/*">
        <div class="hint" id="hint">ここをクリックして画像を選択<br>または画像をドラッグ＆ドロップ</div>
        <img id="preview" alt="preview">
      </div>
      <div class="file-name" id="fileName"></div>
    </label>

    <div class="actions">
      <button id="upload" type="button" disabled>この背景を更新</button>
      <button id="clear" type="button">画像を外す</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <div class="note">
    Token はこのページのソースには保存されません。「このブラウザに保存する」がONのときだけ localStorage に保存します。GitHub API 以外には送信しません。
  </div>
</main>

<script>
const OWNER = "sarscoc";
const REPO = "TOUCHviaNotion";
const BRANCH = "main";
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/backgrounds`;
const TOKEN_KEY = "touchviaNotion.backgroundUploader.token";

const slot = document.getElementById("slot");
const token = document.getElementById("token");
const remember = document.getElementById("remember");
const file = document.getElementById("file");
const drop = document.getElementById("drop");
const hint = document.getElementById("hint");
const preview = document.getElementById("preview");
const fileName = document.getElementById("fileName");
const upload = document.getElementById("upload");
const clear = document.getElementById("clear");
const status = document.getElementById("status");

let selectedFile = null;
let previewUrl = "";

const saved = localStorage.getItem(TOKEN_KEY);
if (saved) token.value = saved;

function setStatus(text, type="") {
  status.textContent = text;
  status.className = `status ${type}`;
}

function syncButton() {
  upload.disabled = !(selectedFile && token.value.trim());
}

function clearPreview() {
  selectedFile = null;
  file.value = "";
  fileName.textContent = "";
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = "";
  preview.removeAttribute("src");
  preview.style.display = "none";
  hint.style.display = "block";
  syncButton();
}

function useFile(nextFile) {
  if (!nextFile || !nextFile.type.startsWith("image/")) {
    setStatus("画像ファイルを選んでください。", "err");
    return;
  }
  clearPreview();
  selectedFile = nextFile;
  previewUrl = URL.createObjectURL(nextFile);
  preview.src = previewUrl;
  preview.style.display = "block";
  hint.style.display = "none";
  fileName.textContent = nextFile.name;
  setStatus("");
  syncButton();
}

file.addEventListener("change", () => useFile(file.files?.[0]));
token.addEventListener("input", syncButton);
clear.addEventListener("click", () => { clearPreview(); setStatus(""); });

["dragenter","dragover"].forEach(type => {
  drop.addEventListener(type, e => {
    e.preventDefault();
    drop.style.borderColor = "#111";
  });
});
["dragleave","drop"].forEach(type => {
  drop.addEventListener(type, e => {
    e.preventDefault();
    drop.style.borderColor = "";
  });
});
drop.addEventListener("drop", e => useFile(e.dataTransfer?.files?.[0]));

function fileToJpegBase64(inputFile, quality = 0.92) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(inputFile);
    img.onload = () => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        URL.revokeObjectURL(url);
        resolve(dataUrl.split(",")[1]);
      } catch (error) {
        URL.revokeObjectURL(url);
        reject(error);
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("画像を読み込めませんでした。"));
    };
    img.src = url;
  });
}

async function githubRequest(url, options = {}) {
  const headers = {
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28",
    "Authorization": `Bearer ${token.value.trim()}`,
    ...(options.headers || {})
  };
  const response = await fetch(url, { ...options, headers });
  if (!response.ok) {
    let message = `${response.status} ${response.statusText}`;
    try {
      const body = await response.json();
      if (body?.message) message = body.message;
    } catch (_) {}
    throw new Error(message);
  }
  if (response.status === 204) return null;
  return response.json();
}

upload.addEventListener("click", async () => {
  if (!selectedFile || !token.value.trim()) return;

  const target = `${slot.value}.jpg`;
  upload.disabled = true;
  setStatus(`${target} を準備しています…`, "work");

  try {
    if (remember.checked) {
      localStorage.setItem(TOKEN_KEY, token.value.trim());
    } else {
      localStorage.removeItem(TOKEN_KEY);
    }

    const content = await fileToJpegBase64(selectedFile);

    let sha = null;
    try {
      const current = await githubRequest(`${API}/${encodeURIComponent(target)}?ref=${encodeURIComponent(BRANCH)}`);
      sha = current?.sha || null;
    } catch (error) {
      if (!String(error.message).includes("404")) throw error;
    }

    setStatus(`${target} をGitHubへ送信しています…`, "work");

    const body = {
      message: `Update background ${target}`,
      content,
      branch: BRANCH
    };
    if (sha) body.sha = sha;

    await githubRequest(`${API}/${encodeURIComponent(target)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    setStatus(`✓ ${target} を更新しました。`, "ok");
  } catch (error) {
    console.error(error);
    setStatus(`更新できませんでした：${error.message}`, "err");
  } finally {
    syncButton();
  }
});

syncButton();
</script>
</body>
</html>
