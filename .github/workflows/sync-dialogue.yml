name: Sync Notion Dialogue

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-notion-dialogue
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build dialogue.json from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DIALOGUE_DATABASE_ID: "3bd4fddb0aaa800da296f7f5b460c014"
        run: node scripts/update-dialogue.mjs

      - name: Commit changed dialogue files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters/*/dialogue.json

          if git diff --cached --quiet; then
            echo "No dialogue changes."
            exit 0
          fi

          git commit -m "Sync dialogue from Notion"
          git push
