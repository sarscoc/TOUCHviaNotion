name: Remove seasonal background logic

on:
  push:
    paths:
      - '.github/workflows/remove-seasonal-background.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove seasonal background selection
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''function setupBackground() {
              const seasonal = backgrounds.find(bg => bg.season && isInPeriod(bg.season.start, bg.season.end));
              if (seasonal) setBackground(seasonal);
          }'''
          new = '''function setupBackground() {
              const initial = backgrounds.find(bg => bg.image === "nomal.jpg") || backgrounds[0];
              if (initial) setBackground(initial);
          }'''
          if old not in s:
              raise SystemExit('seasonal setupBackground block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove seasonal background selection"
          git push
